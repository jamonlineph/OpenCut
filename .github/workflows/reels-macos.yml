name: OpenCut Reels (macOS app)

on:
  push:
    paths:
      - "apps/reels/**"
      - ".github/workflows/reels-macos.yml"
  workflow_dispatch:

concurrency:
  group: reels-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Build and smoke-test OpenCut.app
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/reels
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun test

      # FFmpeg and whisper.cpp built for the app (about 10 minutes, then cached).
      - name: Cache bundled tools
        uses: actions/cache@v6
        with:
          path: apps/reels/.tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/reels/macos/build-tools.sh') }}

      - name: Build FFmpeg and whisper.cpp for the app
        run: |
          command -v cmake >/dev/null || brew install cmake
          bash macos/build-tools.sh

      - name: Build OpenCut.app and DMG
        run: |
          bash macos/build.sh --dmg
          ls -la build/OpenCut.app/Contents/MacOS build/OpenCut.app/Contents/Resources/licenses
          du -sh build/OpenCut.app build/OpenCut.dmg

      - name: Engine starts the Studio
        env:
          OPENCUT_WORKSPACE: ${{ runner.temp }}/engine-ws
        run: |
          ENGINE=build/OpenCut.app/Contents/MacOS/opencut-engine
          "$ENGINE" doctor || true
          "$ENGINE" mcp-config | head -3
          "$ENGINE" studio --port 4511 --no-autopilot &
          for i in $(seq 1 40); do curl -sf localhost:4511/api/state >/dev/null && break; sleep 1; done
          curl -sf localhost:4511/api/state | head -c 200; echo
          curl -sf localhost:4511/ | grep -q '<div id="root">'
          kill %1

      - name: The app edits a real clip with its own tools (no Homebrew)
        env:
          OPENCUT_WORKSPACE: ${{ runner.temp }}/bundled-ws
        run: |
          BIN="$PWD/build/OpenCut.app/Contents/MacOS"
          ENGINE="$BIN/opencut-engine"
          mkdir -p "$OPENCUT_WORKSPACE/models"
          # Multilingual model with language auto-detection, like a fresh install.
          curl -fsSL -o "$OPENCUT_WORKSPACE/models/ggml-base.bin" https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.bin
          echo '{"whisperModel":"ggml-base.bin","language":"auto","autopilot":{"director":"basic","notify":false}}' > "$OPENCUT_WORKSPACE/settings.json"
          "$ENGINE" doctor | tee doctor.txt
          grep -q "built into OpenCut" doctor.txt
          say -o speech.aiff "[[slnc 700]] Hey everyone. [[slnc 1100]] Um, [[slnc 500]] here are three quick tips for better videos. [[slnc 1200]] First, cut out every silence. [[slnc 900]] Follow for more. [[slnc 800]]"
          "$BIN/ffmpeg" -v error -f lavfi -i "testsrc2=s=1920x1080:r=30" -i speech.aiff -shortest \
            -c:v h264_videotoolbox -allow_sw 1 -b:v 6M -pix_fmt yuv420p -c:a aac talk.mp4
          "$BIN/ffmpeg" -v error -i talk.mp4 -ac 1 -ar 16000 talk.wav
          "$BIN/whisper-cli" -m "$OPENCUT_WORKSPACE/models/ggml-base.bin" -f talk.wav -l auto -dl 2>&1 | grep -i "auto-detected language"
          # Review flow: edit, wait for OK with a preview, then approve and export.
          "$ENGINE" auto-edit talk.mp4 --review | tee job.txt
          JOB="$(grep -o 'approve [^ ]*' job.txt | head -1 | cut -d' ' -f2)"
          test -n "$JOB"
          test -z "$(ls -A "$OPENCUT_WORKSPACE/outbox" 2>/dev/null)"
          "$ENGINE" approve "$JOB"
          PROJECT="$("$ENGINE" list | head -1 | cut -d' ' -f1)"
          "$ENGINE" transcript "$PROJECT"
          OUT="$(ls "$OPENCUT_WORKSPACE"/outbox/*.mp4 | head -1)"
          "$BIN/ffprobe" -v error -show_entries stream=codec_name,width,height -show_entries format=duration -of compact "$OUT"
          test -s "$OUT"
          # Captions are drawn by the built-in renderer (this FFmpeg has no libass).
          grep -qF "captions.ffconcat" "$OPENCUT_WORKSPACE"/projects/*/last-render.sh

      - name: App launches its engine and stops it on quit
        run: |
          open build/OpenCut.app
          for i in $(seq 1 60); do curl -sf localhost:4317/api/state >/dev/null && echo "engine up after ${i}s" && break; sleep 1; done
          curl -sf localhost:4317/api/autopilot | head -c 300; echo
          osascript -e 'quit app "OpenCut"'
          sleep 6
          if curl -sf localhost:4317/api/state >/dev/null; then echo "::error::engine still running after quitting the app"; exit 1; fi
          echo "engine stopped with the app"

      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          name: OpenCut-macOS-arm64
          path: apps/reels/build/OpenCut.dmg
          retention-days: 30

  e2e:
    name: Auto-edit a real talking-head clip (whisper.cpp + Homebrew FFmpeg)
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/reels
    env:
      OPENCUT_WORKSPACE: ${{ github.workspace }}/e2e-workspace
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          brew install ffmpeg whisper-cpp

      - name: Speech model and settings
        run: |
          mkdir -p "$OPENCUT_WORKSPACE/models"
          curl -fsSL -o "$OPENCUT_WORKSPACE/models/ggml-base.en.bin" \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.en.bin
          echo '{"whisperModel":"ggml-base.en.bin","autopilot":{"director":"basic","notify":false}}' > "$OPENCUT_WORKSPACE/settings.json"

      - name: Record a talking-head test clip with the macOS voice
        run: |
          say -o speech.aiff "[[slnc 800]] Hey everyone. [[slnc 1200]] Um, [[slnc 500]] today I want to show you how I edit my videos. [[slnc 1400]] So the first thing, [[slnc 600]] so the first thing is to cut out all the silences. [[slnc 1000]] The second thing is adding captions to every word. [[slnc 900]] Follow for more tips. [[slnc 1000]]"
          ffmpeg -v error -f lavfi -i "testsrc2=s=1920x1080:r=30" -i speech.aiff -shortest \
            -c:v libx264 -pix_fmt yuv420p -c:a aac talk.mp4
          ffprobe -v error -show_entries format=duration -of csv=p=0 talk.mp4

      - name: Doctor
        run: bun src/cli.ts doctor

      - name: Auto-edit end to end
        run: |
          bun src/cli.ts auto-edit talk.mp4
          PROJECT="$(bun src/cli.ts list | head -1 | cut -d' ' -f1)"
          bun src/cli.ts transcript "$PROJECT" | tee transcript.txt
          bun src/cli.ts transcript "$PROJECT" --words
          # Raw whisper words and detected silences, for alignment regression tests.
          for d in "$OPENCUT_WORKSPACE"/.cache/*/; do
            [ -f "$d/transcript.raw.json" ] || continue
            bun -e 'const [t, s] = process.argv.slice(1).map((f) => require(f)); console.log("RAW_WORDS " + JSON.stringify(t.words.map((w) => [w.text, w.start, w.end, w.filler ? 1 : 0]))); console.log("SILENCES " + JSON.stringify(s.silences.map((x) => [x.start, x.end])))' "$d/transcript.raw.json" "$d/silence.json"
          done
          bun src/cli.ts show "$PROJECT"
          # Spoken words should survive silence removal (only um/uh and the false start get cut).
          if grep -qE "~~(Hey|everyone!?|today|videos\.|word\.)~~" transcript.txt; then echo "::warning::real words were marked as cut: check word timing"; fi
          if ! grep -qiE "~~u+h*m+,?~~" transcript.txt; then echo "::warning::the um was not cut: check filler timing"; fi
          ls -la "$OPENCUT_WORKSPACE/outbox"
          OUT="$(ls "$OPENCUT_WORKSPACE"/outbox/*.mp4 | head -1)"
          ffprobe -v error -show_entries stream=codec_name,width,height -show_entries format=duration -of compact "$OUT"
          test -s "$OUT"

      - name: Upload the finished reel
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-reel
          path: |
            e2e-workspace/outbox
            e2e-workspace/projects/*/last-render.sh
          retention-days: 14
